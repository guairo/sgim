# ==========================================================
# Perfil PROD - MySQL
# Variables de entorno recomendadas:
#   DB_URL, DB_USER, DB_PASS
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sgim?useSSL=false&serverTimezone=America/Bogota&characterEncoding=utf8mb4}
spring.datasource.username=${DB_USER:sgim}
spring.datasource.password=${DB_PASS:sgim}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# No reinicializar la BD en produccion
spring.sql.init.mode=never
spring.thymeleaf.cache=true
