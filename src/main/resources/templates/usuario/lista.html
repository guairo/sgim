<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: mensaje}"></div>
<div class="container mt-3">
    <div class="d-flex justify-content-between"><h3>Usuarios del sistema</h3>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">Nuevo</a></div>
    <table class="table table-striped table-sm mt-3">
        <thead><tr><th>Username</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Activo</th><th>Ultimo acceso</th><th></th></tr></thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.username}"></td><td th:text="${u.nombreCompleto}"></td>
            <td th:text="${u.correo}"></td><td><span class="badge bg-dark" th:text="${u.rol}"></span></td>
            <td><i class="bi" th:classappend="${u.activo} ? 'bi-check-circle text-success' : 'bi-x-circle text-danger'"></i></td>
            <td th:text="${u.ultimoAcceso}"></td>
            <td class="text-nowrap">
                <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                <form th:action="@{/usuarios/eliminar/{id}(id=${u.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Eliminar?');">
                    <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body></html>
