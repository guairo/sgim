<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Usuario')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container mt-3">
    <h3 th:text="${usuario.id == null} ? 'Nuevo usuario' : 'Editar usuario'"></h3>
    <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" class="row g-3">
        <input type="hidden" th:field="*{id}">
        <div class="col-md-4"><label>Username *</label><input th:field="*{username}" class="form-control" required></div>
        <div class="col-md-8"><label>Nombre completo *</label><input th:field="*{nombreCompleto}" class="form-control" required></div>
        <div class="col-md-6"><label>Correo *</label><input type="email" th:field="*{correo}" class="form-control" required></div>
        <div class="col-md-3">
            <label>Rol *</label>
            <select th:field="*{rol}" class="form-select" required>
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
            </select>
        </div>
        <div class="col-md-3 form-check mt-4">
            <input class="form-check-input" type="checkbox" th:field="*{activo}">
            <label class="form-check-label">Activo</label>
        </div>
        <div class="col-md-6">
            <label th:text="${usuario.id == null} ? 'Contrasena *' : 'Nueva contrasena (opcional)'"></label>
            <input type="password" name="nuevoPassword" class="form-control" th:required="${usuario.id == null}">
        </div>
        <div class="col-12">
            <button class="btn btn-primary">Guardar</button>
            <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body></html>
