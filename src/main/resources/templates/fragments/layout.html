<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - SGIM'">SGIM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sgim.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <i class="bi bi-boxes"></i> SGIM
        </a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/bienes}">Bienes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/movimientos}">Movimientos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/mantenimientos}">Mantenimientos</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Maestros</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/dependencias}">Dependencias</a></li>
                        <li><a class="dropdown-item" th:href="@{/categorias}">Categorias</a></li>
                        <li><a class="dropdown-item" th:href="@{/proveedores}">Proveedores</a></li>
                        <li><a class="dropdown-item" th:href="@{/funcionarios}">Funcionarios</a></li>
                    </ul>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/usuarios}">Usuarios</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/auditoria}">Auditoria</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item"><span class="nav-link"><i class="bi bi-person-circle"></i>
                    <span sec:authentication="name">user</span>
                    (<span sec:authentication="principal.authorities">ROLE</span>)</span></li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button class="btn btn-outline-light btn-sm">Salir</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="mensaje" th:if="${msg}" class="container mt-3">
    <div class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<footer th:fragment="footer" class="text-center text-muted py-4 mt-5 border-top">
    <small>SGIM &copy; 2026 - Proyecto formativo SENA ADSO</small>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</body>
</html>
