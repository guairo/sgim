<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Funcionario')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container mt-3">
    <h3 th:text="${funcionario.id == null} ? 'Nuevo funcionario' : 'Editar funcionario'"></h3>
    <form th:action="@{/funcionarios/guardar}" th:object="${funcionario}" method="post" class="row g-3">
        <input type="hidden" th:field="*{id}">
        <div class="col-md-4"><label>Documento *</label><input th:field="*{documento}" class="form-control" required></div>
        <div class="col-md-4"><label>Nombres *</label><input th:field="*{nombres}" class="form-control" required></div>
        <div class="col-md-4"><label>Apellidos *</label><input th:field="*{apellidos}" class="form-control" required></div>
        <div class="col-md-6"><label>Cargo</label><input th:field="*{cargo}" class="form-control"></div>
        <div class="col-md-6"><label>Correo</label><input type="email" th:field="*{correo}" class="form-control"></div>
        <div class="col-md-6"><label>Telefono</label><input th:field="*{telefono}" class="form-control"></div>
        <div class="col-md-6">
            <label>Dependencia *</label>
            <select name="dependenciaId" class="form-select" required>
                <option th:each="d : ${dependencias}" th:value="${d.id}" th:text="${d.nombre}"
                        th:selected="${funcionario.dependencia != null and funcionario.dependencia.id == d.id}"></option>
            </select>
        </div>
        <div class="col-md-2 form-check mt-4">
            <input class="form-check-input" type="checkbox" th:field="*{activo}">
            <label class="form-check-label">Activo</label>
        </div>
        <div class="col-12">
            <button class="btn btn-primary">Guardar</button>
            <a th:href="@{/funcionarios}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body></html>
