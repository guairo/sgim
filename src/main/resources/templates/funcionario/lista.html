<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:replace="~{fragments/layout :: head('Funcionarios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: mensaje}"></div>
<div class="container mt-3">
    <div class="d-flex justify-content-between"><h3>Funcionarios</h3>
        <a th:href="@{/funcionarios/nuevo}" class="btn btn-primary"
           sec:authorize="hasAnyRole('ADMIN','OPERADOR')">Nuevo</a></div>
    <table class="table table-striped table-sm mt-3">
        <thead><tr><th>Documento</th><th>Nombres</th><th>Apellidos</th><th>Cargo</th><th>Dependencia</th><th>Activo</th><th></th></tr></thead>
        <tbody>
        <tr th:each="f : ${funcionarios}">
            <td th:text="${f.documento}"></td><td th:text="${f.nombres}"></td><td th:text="${f.apellidos}"></td>
            <td th:text="${f.cargo}"></td><td th:text="${f.dependencia.nombre}"></td>
            <td><i class="bi" th:classappend="${f.activo} ? 'bi-check-circle text-success' : 'bi-x-circle text-danger'"></i></td>
            <td class="text-nowrap">
                <a th:href="@{/funcionarios/editar/{id}(id=${f.id})}" class="btn btn-sm btn-outline-secondary"
                   sec:authorize="hasAnyRole('ADMIN','OPERADOR')"><i class="bi bi-pencil"></i></a>
                <form th:action="@{/funcionarios/eliminar/{id}(id=${f.id})}" method="post" class="d-inline"
                      sec:authorize="hasRole('ADMIN')" onsubmit="return confirm('Eliminar?');">
                    <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body></html>
