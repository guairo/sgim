<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:replace="~{fragments/layout :: head('Movimientos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: mensaje}"></div>
<div class="container mt-3">
    <div class="d-flex justify-content-between"><h3>Historial de movimientos</h3>
        <a th:href="@{/movimientos/nuevo}" class="btn btn-primary"
           sec:authorize="hasAnyRole('ADMIN','OPERADOR')">Nuevo</a></div>
    <table class="table table-striped table-sm mt-3">
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Bien</th><th>Dep. origen</th><th>Dep. destino</th><th>Func. destino</th><th>Usuario</th></tr></thead>
        <tbody>
        <tr th:each="m : ${movimientos.content}">
            <td th:text="${#temporals.format(m.fechaMovimiento,'yyyy-MM-dd HH:mm')}"></td>
            <td><span class="badge bg-secondary" th:text="${m.tipo}"></span></td>
            <td th:text="${m.bien.placa + ' - ' + m.bien.nombre}"></td>
            <td th:text="${m.dependenciaOrigen != null ? m.dependenciaOrigen.nombre : '-'}"></td>
            <td th:text="${m.dependenciaDestino != null ? m.dependenciaDestino.nombre : '-'}"></td>
            <td th:text="${m.funcionarioDestino != null ? m.funcionarioDestino.nombreCompleto : '-'}"></td>
            <td th:text="${m.usuarioRegistro}"></td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body></html>
