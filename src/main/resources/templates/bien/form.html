<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Bien')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container mt-3">
    <h3 th:text="${bien.id == null} ? 'Nuevo bien' : 'Editar bien'"></h3>
    <form th:action="@{/bienes/guardar}" th:object="${bien}" method="post" class="row g-3 mt-2">
        <input type="hidden" th:field="*{id}">
        <div class="col-md-4">
            <label class="form-label">Placa *</label>
            <input th:field="*{placa}" class="form-control" required>
            <div class="text-danger small" th:if="${#fields.hasErrors('placa')}" th:errors="*{placa}"></div>
        </div>
        <div class="col-md-8">
            <label class="form-label">Nombre *</label>
            <input th:field="*{nombre}" class="form-control" required>
        </div>
        <div class="col-md-12">
            <label class="form-label">Descripcion</label>
            <textarea th:field="*{descripcion}" class="form-control" rows="2"></textarea>
        </div>
        <div class="col-md-4"><label>Marca</label><input th:field="*{marca}" class="form-control"></div>
        <div class="col-md-4"><label>Modelo</label><input th:field="*{modelo}" class="form-control"></div>
        <div class="col-md-4"><label>Serial</label><input th:field="*{serial}" class="form-control"></div>
        <div class="col-md-4">
            <label>Valor compra *</label>
            <input type="number" step="0.01" th:field="*{valorCompra}" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label>Fecha compra</label>
            <input type="date" th:field="*{fechaCompra}" class="form-control">
        </div>
        <div class="col-md-4">
            <label>Categoria *</label>
            <select name="categoriaId" class="form-select" required>
                <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                        th:selected="${bien.categoria != null and bien.categoria.id == c.id}"></option>
            </select>
        </div>
        <div class="col-md-6">
            <label>Proveedor</label>
            <select name="proveedorId" class="form-select">
                <option value="">-- Ninguno --</option>
                <option th:each="p : ${proveedores}" th:value="${p.id}" th:text="${p.razonSocial}"
                        th:selected="${bien.proveedor != null and bien.proveedor.id == p.id}"></option>
            </select>
        </div>
        <div class="col-md-6">
            <label>Dependencia *</label>
            <select name="dependenciaId" class="form-select" required>
                <option th:each="d : ${dependencias}" th:value="${d.id}" th:text="${d.nombre}"
                        th:selected="${bien.dependencia != null and bien.dependencia.id == d.id}"></option>
            </select>
        </div>
        <div class="col-12">
            <button class="btn btn-primary">Guardar</button>
            <a th:href="@{/bienes}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
