<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:replace="~{fragments/layout :: head('Mantenimientos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: mensaje}"></div>
<div class="container mt-3">
    <div class="d-flex justify-content-between"><h3>Mantenimientos</h3>
        <a th:href="@{/mantenimientos/nuevo}" class="btn btn-primary"
           sec:authorize="hasAnyRole('ADMIN','OPERADOR')">Programar</a></div>
    <table class="table table-striped table-sm mt-3">
        <thead><tr><th>Bien</th><th>Tipo</th><th>Programada</th><th>Ejecucion</th><th>Estado</th><th>Costo</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="m : ${mantenimientos}">
            <td th:text="${m.bien.placa}"></td>
            <td th:text="${m.tipo}"></td>
            <td th:text="${m.fechaProgramada}"></td>
            <td th:text="${m.fechaEjecucion}"></td>
            <td><span class="badge bg-info" th:text="${m.estado}"></span></td>
            <td th:text="${m.costo}"></td>
            <td class="text-nowrap" sec:authorize="hasAnyRole('ADMIN','OPERADOR')">
                <form th:action="@{/mantenimientos/iniciar/{id}(id=${m.id})}" method="post" class="d-inline"
                      th:if="${m.estado.name() == 'PROGRAMADO'}">
                    <button class="btn btn-sm btn-outline-primary">Iniciar</button>
                </form>
                <form th:action="@{/mantenimientos/finalizar/{id}(id=${m.id})}" method="post" class="d-inline"
                      th:if="${m.estado.name() == 'EN_EJECUCION'}">
                    <button class="btn btn-sm btn-outline-success">Finalizar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body></html>
