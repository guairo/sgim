<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Mantenimiento')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container mt-3">
    <h3>Programar mantenimiento</h3>
    <form th:action="@{/mantenimientos/guardar}" th:object="${mantenimiento}" method="post" class="row g-3">
        <div class="col-md-6">
            <label>Bien *</label>
            <select name="bienId" class="form-select" required>
                <option th:each="b : ${bienes}" th:value="${b.id}" th:text="${b.placa + ' - ' + b.nombre}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label>Tipo *</label>
            <select th:field="*{tipo}" class="form-select" required>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label>Proveedor</label>
            <select name="proveedorId" class="form-select">
                <option value="">--</option>
                <option th:each="p : ${proveedores}" th:value="${p.id}" th:text="${p.razonSocial}"></option>
            </select>
        </div>
        <div class="col-md-3"><label>Fecha programada</label><input type="date" th:field="*{fechaProgramada}" class="form-control"></div>
        <div class="col-md-3"><label>Costo</label><input type="number" step="0.01" th:field="*{costo}" class="form-control"></div>
        <div class="col-md-12"><label>Descripcion</label><textarea th:field="*{descripcion}" class="form-control"></textarea></div>
        <div class="col-12">
            <button class="btn btn-primary">Programar</button>
            <a th:href="@{/mantenimientos}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body></html>
