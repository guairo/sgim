<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:replace="~{fragments/layout :: head('Proveedores')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: mensaje}"></div>
<div class="container mt-3">
    <div class="d-flex justify-content-between"><h3>Proveedores</h3>
        <a th:href="@{/proveedores/nuevo}" class="btn btn-primary"
           sec:authorize="hasAnyRole('ADMIN','OPERADOR')">Nuevo</a></div>
    <table class="table table-striped table-sm mt-3">
        <thead><tr><th>NIT</th><th>Razon social</th><th>Telefono</th><th>Correo</th><th>Activo</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="p : ${proveedores}">
            <td th:text="${p.nit}"></td><td th:text="${p.razonSocial}"></td>
            <td th:text="${p.telefono}"></td><td th:text="${p.correo}"></td>
            <td><i class="bi" th:classappend="${p.activo} ? 'bi-check-circle text-success' : 'bi-x-circle text-danger'"></i></td>
            <td class="text-nowrap">
                <a th:href="@{/proveedores/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-secondary"
                   sec:authorize="hasAnyRole('ADMIN','OPERADOR')"><i class="bi bi-pencil"></i></a>
                <form th:action="@{/proveedores/eliminar/{id}(id=${p.id})}" method="post" class="d-inline"
                      sec:authorize="hasRole('ADMIN')" onsubmit="return confirm('Eliminar?');">
                    <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body></html>
