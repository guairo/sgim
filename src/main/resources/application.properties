# ==========================================================
# SGIM - Configuracion principal
# Perfil por defecto: dev (H2 en memoria para ejecutar sin BD)
# Para produccion usar: --spring.profiles.active=prod
# ==========================================================
spring.application.name=sgim
spring.profiles.active=dev

# Vistas Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# Mensajes de validacion en espanol
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.sena.sgim=DEBUG

# Servidor
server.port=8080
server.servlet.encoding.charset=UTF-8
server.error.whitelabel.enabled=false
